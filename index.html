<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Takit'os chez vous</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first single scroll. A turquoise "wall" header carries the paper-fan garland from the dining room;
   below it, sticky category chips, menu rows with drawn tiles, a bottom basket bar, and sheets for items, the taco kit and checkout.
   From 960px the basket becomes a sticky column. Colours come from the room: turquoise wall, rosa mexicano, pale pine, tissue-paper accents. */
:root{
  --paper:#FFFDF9; --paper-2:#F7F0E5; --pino:#E6D2B5; --line:#EDE2D2;
  --ink:#16292B; --ink-soft:#4E6265;
  --wall:#0E8791; --wall-deep:#0A6870; --wall-ink:#F3FBFB; --wall-soft:#CBEBED;
  --rosa:#CF2468; --rosa-ink:#FFFFFF; --rosa-soft:#FBDFEA;
  --sol:#F2B33D; --sol-soft:#FDEFC9; --verde:#4E9A45; --verde-soft:#D7EDCF; --naranja:#E8742D; --naranja-soft:#FBDDC6; --morado:#7B3F8C; --morado-soft:#E9DAF0; --rojo:#D8432F;
  --ok:#2E7D4F; --crit:#B3261E; --scrim:rgba(10,30,32,.52); --teal-ink:#0B6A73;
  --tile-sol:#FBE3A6; --tile-wall:#BFE6E8; --tile-rosa:#F8CFDE; --tile-verde:#D2EBC6; --tile-naranja:#F9D2B4; --tile-morado:#E3D1EC; --tile-dot:rgba(255,255,255,.5);
  --art-ink:#1E2A2B; --art-shadow:rgba(22,41,43,.16);
  --f-bun:#EFC77E; --f-crust:#C9853A; --f-leaf:#5FA343; --f-tomato:#D9452C; --f-cheese:#F9C93B; --f-crumb:#D9902E; --f-pork:#8C3A22; --f-pork-hi:#C2633F;
  --f-beef:#5C301C; --f-veg:#6E8B3D; --f-fish:#FBEFE0; --f-fishfry:#E5A748; --f-shrimp:#F28B6C; --f-sauce:#F4A88F; --f-lime:#9CCB3B; --f-mango:#F4B53C;
  --f-onion:#A0457A; --f-plantain:#EBB64B; --f-plantain-dk:#B87A22; --f-fry:#E8782A; --f-kraft:#D2A86E; --f-kraft-dk:#B98B50; --f-glass:#EEF7F6; --f-juice:#F39A2B;
  --f-can:#2F8F78; --f-canband:#F5C24F; --f-beer:#F4C04A; --f-label:#F5EBD0; --f-plate:#FFFDF8; --f-bowl:#2E8C73; --f-ceviche:#F4EFD9; --f-box:#F08A6B;
  --f-tortilla:#F3DFA8; --f-tortilla-dk:#D9B86A; --f-cream:#FFF6E6; --f-biscuit:#C99A62; --f-fruit:#F2A541; --f-quinoa:#D8B48A; --f-cinnamon:#9B5A2E;
  --f-chia:#F4F1EA; --f-passion:#F2B92E; --f-passion-shell:#6E2D5A; --f-purple:#5B2150; --f-purple-corn:#3A1838; --f-white:#FFFFFF;
  --f-mandarina:#F28A2E; --f-guayaba:#F4B6C8; --f-toronja:#6FA84A; --f-cap:#C9CED1; --f-yellow-can:#F5D320; --f-blue:#1E4FA3; --f-amber:#B8621F; --f-gold:#D9B44A; --f-red:#C62E2E; --f-dark-beer:#4A2512;
  --shadow-pop:0 18px 50px -24px rgba(10,40,44,.55);
  --font-display:'Alfa Slab One','Rockwell Extra Bold','Rockwell','Roboto Slab','Bookman Old Style',Georgia,serif;
  --font-text:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1C1E; --paper-2:#17292C; --pino:#3B3328; --line:#243739;
    --ink:#EAF3F2; --ink-soft:#A6BABB;
    --wall:#0B5F67; --wall-deep:#084A50; --wall-ink:#ECF8F8; --wall-soft:#123E42;
    --rosa:#F2639B; --rosa-ink:#1B0A11; --rosa-soft:#47192C;
    --sol:#F4C35A; --sol-soft:#3B3117; --verde:#78C26B; --verde-soft:#1D3A1D; --naranja:#F29558; --naranja-soft:#43281A; --morado:#B987C9; --morado-soft:#33213B; --rojo:#F07A64;
    --ok:#6CC28F; --crit:#F28B82; --scrim:rgba(0,0,0,.62); --teal-ink:#86D3D9;
    --tile-sol:#5A4A22; --tile-wall:#1D4B4F; --tile-rosa:#552538; --tile-verde:#28452A; --tile-naranja:#55361F; --tile-morado:#3F2B4A; --tile-dot:rgba(255,255,255,.12);
    --art-shadow:rgba(0,0,0,.35);
    --shadow-pop:0 18px 50px -20px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1C1E; --paper-2:#17292C; --pino:#3B3328; --line:#243739;
  --ink:#EAF3F2; --ink-soft:#A6BABB;
  --wall:#0B5F67; --wall-deep:#084A50; --wall-ink:#ECF8F8; --wall-soft:#123E42;
  --rosa:#F2639B; --rosa-ink:#1B0A11; --rosa-soft:#47192C;
  --sol:#F4C35A; --sol-soft:#3B3117; --verde:#78C26B; --verde-soft:#1D3A1D; --naranja:#F29558; --naranja-soft:#43281A; --morado:#B987C9; --morado-soft:#33213B; --rojo:#F07A64;
  --ok:#6CC28F; --crit:#F28B82; --scrim:rgba(0,0,0,.62); --teal-ink:#86D3D9;
  --tile-sol:#5A4A22; --tile-wall:#1D4B4F; --tile-rosa:#552538; --tile-verde:#28452A; --tile-naranja:#55361F; --tile-morado:#3F2B4A; --tile-dot:rgba(255,255,255,.12);
  --art-shadow:rgba(0,0,0,.35);
  --shadow-pop:0 18px 50px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.locked{overflow:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-text);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--wall)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
.nw{white-space:nowrap}
.small{font-size:13.5px;color:var(--ink-soft);margin:0}
.link{background:none;border:0;padding:0;color:var(--teal-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:14px;text-align:left}
.sel{user-select:all;font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Demo ribbon */
.ribbon{background:var(--sol-soft);color:var(--ink);font-size:13px;font-weight:600}
.ribbon .wrap{padding-block:6px;display:flex;gap:8px;align-items:center}
.ribbon b{background:var(--ink);color:var(--paper);border-radius:999px;padding:1px 8px;font-size:12px}

/* Hero: the wall */
.hero{background:var(--wall);color:var(--wall-ink);position:relative;overflow:hidden}
.garland{display:block;width:100%;height:66px}
.garland.play .fan{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.6s ease-out both}
@keyframes sway{0%{transform:rotate(7deg)}35%{transform:rotate(-5deg)}65%{transform:rotate(3deg)}100%{transform:rotate(0)}}
.hero-in{display:grid;gap:12px;padding-block:0 22px;min-width:0}
.hero-in > *{min-width:0}
.hero-grid{display:grid;gap:22px}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px}
.wordmark{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,12.4vw,104px);line-height:.95;margin:0;letter-spacing:.01em;color:var(--wall-ink);text-shadow:.045em .05em 0 var(--rosa);white-space:nowrap;min-width:0}
.wordmark .ap{color:var(--sol)}
.lang-btn{border:1.5px solid var(--wall-ink);background:transparent;color:var(--wall-ink);border-radius:999px;padding:4px 11px;font-weight:800;font-size:13px;margin-top:4px}
.tagline{margin:0;font-size:clamp(16.5px,4.3vw,20px);font-weight:600;max-width:40ch;line-height:1.35}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0;font-size:15px}
.status .dot{width:9px;height:9px;border-radius:50%;background:#7EE2A0;box-shadow:0 0 0 4px rgba(126,226,160,.25);flex:none}
.status b{font-weight:800}
.status span{opacity:.85}
.status-sub{margin:-6px 0 0;font-size:15px;opacity:.88}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--wall-deep);padding:4px;border-radius:14px;max-width:440px}
.mode button{border:0;background:transparent;color:var(--wall-ink);border-radius:11px;padding:10px 8px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.mode button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.again{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;background:var(--wall-deep);border-radius:14px;padding:10px 12px;max-width:440px}
.again p{margin:0;font-size:14px}
.again button{border:0;border-radius:10px;background:var(--sol);color:#1E2A2B;font-weight:800;padding:8px 12px;font-size:14px}
.sig{display:none}
@media (min-width:960px){
  .hero-grid{grid-template-columns:minmax(0,1fr) 360px;align-items:end}
  .sig{display:grid;gap:8px;justify-items:start;align-content:start;background:var(--paper);color:var(--ink);border-radius:26px 26px 0 0;padding:20px 22px 24px;margin-top:8px}
  .sig .art{width:190px;height:190px;justify-self:center;margin-top:-6px}
  .sig h2{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.05;margin:0}
  .sig p{margin:0;font-size:15px;color:var(--ink-soft)}
  .sig button{margin-top:4px;border:0;border-radius:12px;background:var(--rosa);color:var(--rosa-ink);font-weight:800;padding:10px 16px}
}

/* Chips */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.cats-in{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.cats-in::-webkit-scrollbar{display:none}
.chip{position:relative;flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-current="true"]{background:var(--wall);border-color:var(--wall);color:var(--wall-ink)}
.chip .new-dot{width:7px;height:7px;border-radius:50%;background:var(--rosa)}

/* Layout */
.layout{display:grid;gap:28px;padding-block:20px 36px}
.menu{min-width:0}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start}.basket-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto}}
@media (max-width:959.98px){.basket-col{display:none}}
.sec{scroll-margin-top:72px}
.sec + .sec{margin-top:34px}
.sec-head{display:grid;gap:5px;margin-bottom:2px}
.sec-head h2{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,7vw,34px);line-height:1.05;margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.sec-head p{margin:0;color:var(--ink-soft);font-size:15px;max-width:62ch}
.new-tag{font-family:var(--font-text);font-size:12.5px;font-weight:800;background:var(--rosa-soft);color:var(--rosa);border-radius:999px;padding:3px 9px;letter-spacing:.02em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .new-tag{color:var(--rosa)}}
.divider{display:flex;align-items:center;gap:12px;margin:44px 0 6px;color:var(--ink-soft);font-weight:700;font-size:14px}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
.divider svg{flex:none}

/* Rows */
.rows{list-style:none;margin:0;padding:0}
@media (min-width:1220px){.rows{display:grid;grid-template-columns:1fr 1fr;column-gap:30px}}
.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:15px;border-bottom:1px solid var(--line)}
.row-name{margin:0;font-size:17.5px;font-weight:800;line-height:1.2}
.row-open{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left}
.row-open::after{content:"";position:absolute;inset:0}
.row-open:focus-visible{outline:none}
.row-open:focus-visible::after{outline:3px solid var(--sol);outline-offset:2px;border-radius:10px}
.row-desc{margin:4px 0 0;color:var(--ink-soft);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px}
.price{font-family:var(--font-display);font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.meal{font-size:13.5px;font-weight:700;color:var(--teal-ink)}
.tag{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sol-soft);white-space:nowrap}
.tag.t-vege{background:var(--verde-soft)}.tag.t-spicy{background:var(--naranja-soft)}.tag.t-new{background:var(--rosa-soft)}.tag.t-cold{background:var(--wall-soft)}.tag.t-alc{background:var(--paper-2)}
.tile{position:relative;pointer-events:none;width:92px;height:92px;border-radius:18px;display:grid;place-items:center;background-color:var(--tile-sol);background-image:radial-gradient(circle at 3px 3px,var(--tile-dot) 1.3px,transparent 1.6px);background-size:11px 11px;flex:none}
.tile.wall{background-color:var(--tile-wall)}.tile.rosa{background-color:var(--tile-rosa)}.tile.verde{background-color:var(--tile-verde)}.tile.naranja{background-color:var(--tile-naranja)}.tile.morado{background-color:var(--tile-morado)}
.art{width:86%;height:86%;display:block}
.quick{position:absolute;pointer-events:auto;right:-7px;bottom:-7px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:var(--rosa);color:var(--rosa-ink);display:grid;place-items:center;box-shadow:0 0 0 3px var(--paper)}

/* Kit card */
.kitcard{margin-top:14px;display:grid;gap:14px;background:var(--paper-2);border-radius:22px;padding:16px;border:1px solid var(--line)}
@media (min-width:700px){.kitcard{grid-template-columns:200px minmax(0,1fr);align-items:center}}
.kitcard .tile{width:100%;height:150px;border-radius:16px}
.kitcard .art{width:150px;height:150px}
.kit-sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ks{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:2px;font-size:13.5px}
.ks b{font-size:15px}
.ks .price{font-size:18px}
.kitcard-cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--rosa);color:var(--rosa-ink);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.wall{background:var(--wall);color:var(--wall-ink)}
.btn:disabled{opacity:.45}

/* Basket */
.bp{display:grid;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px}
.sheet .bp{border:0;padding:0;background:transparent}
.bp-title{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1;margin:0}
.bp-empty{margin:0;color:var(--ink-soft);font-size:15px}
.bl{list-style:none;margin:0;padding:0;display:grid}
.bl-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.bl-main{display:grid;gap:2px;min-width:0}
.bl-main b{font-weight:800}
.bl-opt{font-size:13.5px;color:var(--ink-soft)}
.bl-note{font-size:13.5px;font-style:italic;color:var(--ink-soft)}
.bl-side{display:grid;justify-items:end;gap:6px;align-content:start}
.bl-price{font-weight:800;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--paper)}
.qty button{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center;border-radius:10px}
@media (max-width:359.98px){.sheet-foot .qty button{width:34px}.sheet-foot .qty span{min-width:18px}}
.qty span{min-width:22px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.qty.sm button{width:32px;height:32px}
.suggest{display:grid;gap:8px}
.suggest-row{display:flex;flex-wrap:wrap;gap:8px}
.sug{border:1.5px dashed var(--ink-soft);background:transparent;border-radius:12px;padding:7px 11px;font-weight:700;font-size:13.5px}
.check{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--rosa)}
.promo{display:flex;gap:8px}
.promo input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--paper-2);border-radius:12px;padding:9px 12px;text-transform:uppercase}
.msg{margin:0;font-size:13.5px;font-weight:700}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--crit)}
.totals{display:grid;gap:4px;font-variant-numeric:tabular-nums;margin:0}
.totals div{display:flex;justify-content:space-between;gap:12px;font-size:14.5px}
.totals dt{color:var(--ink-soft)}.totals dd{margin:0}
.totals .grand{font-weight:800;font-size:17px;padding-top:6px;border-top:1px solid var(--line)}
.totals .grand dt{color:var(--ink)}
.block{margin:0;font-size:14px;font-weight:700;color:var(--crit)}
.btn-main{width:100%;border:0;border-radius:14px;background:var(--rosa);color:var(--rosa-ink);font-weight:800;padding:14px 16px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn-main:disabled{opacity:.45}
.basket-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--paper) 62%,transparent)}
.basket-btn{width:100%;max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:16px;background:var(--rosa);color:var(--rosa-ink);padding:14px 18px;font-weight:800;font-size:16px;box-shadow:var(--shadow-pop)}
.bb-l{display:flex;align-items:center;gap:10px}
.bb-n{background:var(--rosa-ink);color:var(--rosa);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;padding:0 6px}
@media (min-width:960px){.basket-bar{display:none}}

/* Footer */
.foot{border-top:1px solid var(--line);padding-block:26px 120px;display:grid;gap:14px;font-size:14px;color:var(--ink-soft)}
.foot p{margin:0}
.foot b{color:var(--ink)}
.carte-link{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper-2);border-radius:16px;padding:14px 16px;color:var(--ink)}
.carte-link b{display:block;font-family:var(--font-display);font-weight:400;font-size:20px;line-height:1.1}
.carte-link span{font-size:14px;color:var(--ink-soft)}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 16px}
.foot-links button{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.foot-demo{border:1.5px dashed var(--ink-soft);border-radius:12px;padding:10px 12px}

/* Sheets */

  const base = S.basket.filter(l => l.kit || !item(l.id).alcohol).reduce((s, l) => s + lineUnit(l) * l.qty, 0);
  const disc = S.promo === 'BIENVENUE' ? Math.round(base * 10) / 100 : 0;
  const c = commune(S.form.commune);
  const fee = (S.mode === 'delivery' && c) ? c.fee : 0;
  return {sub, disc, fee, total:Math.round((sub - disc + fee) * 100) / 100, count:S.basket.reduce((s, l) => s + l.qty, 0), known:S.mode !== 'delivery' || !!c};
}

/* every island key (commune names, postcodes, villages, beaches) with the commune it points to;
   a place written with its article also matches without it ("port du Douhet") */
const ARTICLE = /^(le|la|les|l) /;
const KEYS = [];
COMMUNES.forEach(c => { c.keys.forEach(k => KEYS.push({k, c:c.id})); c.cp.forEach(k => KEYS.push({k, c:c.id})); });
PLACES.forEach(p => { const k = norm(p.n); KEYS.push({k, c:p.c, place:p.n}); const bare = k.replace(ARTICLE, ''); if(bare !== k && bare.length >= 5) KEYS.push({k:bare, c:p.c, place:p.n}); });
function detect(text){
  const n = ' ' + norm(text) + ' ';
  if(n.trim().length < 2) return {commune:null, mainland:false};
  /* the commune usually ends an address: keep the match that ends last, then the longest */
  let best = null;
  KEYS.forEach(e => { const i = n.lastIndexOf(' ' + e.k + ' '); if(i < 0) return; const end = i + e.k.length; if(!best || end > best.end || (end === best.end && e.k.length > best.k.length)) best = {end, k:e.k, c:e.c}; });
  if(best) return {commune:best.c, mainland:false, atEnd:best.end >= n.length - 2};
  if(MAINLAND.some(k => n.includes(' ' + k + ' '))) return {commune:null, mainland:true};
  return {commune:null, mainland:false};
}
function suggestions(text){
  const n = norm(text); if(n.length < 2) return [];
  const words = n.split(' '); const last = words[words.length - 1];
  if(last.length < 2 || /^\d+$/.test(last) || SUGG_STOP.includes(last)) return [];
  const d = detect(text); if(d.commune && d.atEnd) return [];
  const out = [];
  PLACES.forEach(p => { const pn = norm(p.n); if(!n.includes(pn) && pn.split(' ').some(w => w.length > 3 && w.startsWith(last))) out.push({label:p.n, c:p.c}); });
  COMMUNES.forEach(c => { const cn = norm(c.name); if(last.length >= 3 && !c.keys.some(k => (' ' + n + ' ').includes(' ' + k + ' ')) && cn.split(' ').some(w => w.startsWith(last))) out.push({label:c.name, c:c.id}); });
  return out.slice(0, 5);
}

/* picking a suggestion replaces the half-typed words it completes */
function completeWith(addr, label){
  const lw = norm(label).split(' ');
  const words = addr.trim().split(/\s+/).filter(Boolean);
  while(words.length){ const w = norm(words[words.length - 1]); if(w && lw.some(x => x.startsWith(w))) words.pop(); else break; }
  const head = words.join(' ').replace(/[,\s]+$/, '');
  return (head ? head + ', ' : '') + label;
}

function focusKeyOf(a){
  if(!a || a === document.body || a === document.documentElement) return null;
  if(a.id) return '#' + CSS.escape(a.id);

  return null;
}
function keepFocus(root, fn){ const a = document.activeElement; const k = (a && root.contains(a)) ? focusKeyOf(a) : null; fn(); if(k && !document.contains(a)){ try{ const n = root.querySelector(k); if(n && n.getClientRects().length) n.focus({preventScroll:true}); }catch(e){} } }

function dayFrom(days){ const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + days); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function fiestaErr(){ const f = SH.f; if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date || '')) return t('fzErrDate'); if(f.date < f.minDate) return t('fzErrSoon'); if([2, 3].includes(new Date(f.date + 'T12:00').getDay())) return t('fzErrClosed'); return ''; }
function frDate(iso){ try{ return new Intl.DateTimeFormat('fr-FR', {weekday:'long', day:'numeric', month:'long'}).format(new Date(iso + 'T12:00')); }catch(e){ return iso; } }
function fiestaMessage(){

function orderCode(){

/* ================= scroll spy ================= */
let spy = null;
function setupSpy(){
  if(spy){ spy.disconnect(); spy = null; }
  if(location.hash === '#carte' || !('IntersectionObserver' in window)) return;
  spy = new IntersectionObserver(es => { es.forEach(e => { if(e.isIntersecting) markChip(e.target.dataset.c); }); }, {rootMargin:'-70px 0px -60% 0px', threshold:0});
  document.querySelectorAll('.sec').forEach(s => spy.observe(s));
}
function markChip(id){
  document.querySelectorAll('.chip[data-c]').forEach(b => b.setAttribute('aria-current', b.dataset.c === id ? 'true' : 'false'));
  const b = document.querySelector('.chip[data-c="' + id + '"]'); const box = document.querySelector('.cats-in');
  if(b && box) box.scrollTo({left:b.offsetLeft - box.clientWidth / 2 + b.clientWidth / 2, behavior:reduceMotion() ? 'auto' : 'smooth'});
}

let toastTimer = null;
function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }
function rerender(){ save(); render(); if(SH) renderSheet(true); }
function validate(step){
  const f = S.form;
  if(step === 2 && f.slot !== 'asap' && !slotList().some(s => hm(s.m) === f.slot && !s.full)) f.slot = 'asap';
  if(step === 2 && S.mode === 'delivery'){
    const det = detect(f.addr);
    if(det.mainland || norm(f.addr).length < 3) return t('errAddr');
    if(!commune(f.commune)) return t('errCommune');
    const m = minBlock(); if(m) return m;
  }
  if(step === 3){ if(!f.name.trim()) return t('errName'); if(hasAlcohol(S.basket) && !f.age) return t('errAge'); }
  return '';
}

  'kit-inc':() => { SH.qty = Math.min(10, SH.qty + 1); renderSheet(true); },
  'kit-dec':() => { SH.qty = Math.max(1, SH.qty - 1); renderSheet(true); },
  'kit-add':() => { const k = SH.kit; if(!k.fillings.length){ SH.kitErr = true; renderSheet(true); const fl = document.querySelector('#sheet .fills'); if(fl) fl.scrollIntoView({block:'center', behavior:reduceMotion() ? 'auto' : 'smooth'}); const c = document.querySelector('#sheet .fills input:not([disabled])'); if(c) c.focus({preventScroll:true}); return; } addLine({id:'kit', kit:{size:k.size, fillings:k.fillings.slice(), side:k.size === 'familia' ? k.side : null}, qty:SH.qty, note:(SH.note || '').trim()}); closeSheet(); save(); render(); toast(t('added') + ' : ' + lineName({kit:k})); },
  'fiesta-open':() => openSheet('fiesta', {f:{guests:10, date:openDayFrom(3), minDate:dayFrom(2), time:'19:30', wishes:[], note:''}}),
  'fz-inc':() => { SH.f.guests = Math.min(60, SH.f.guests + 1); renderSheet(true); },
  'fz-dec':() => { SH.f.guests = Math.max(8, SH.f.guests - 1); renderSheet(true); },
  'fz-send':el => { toast(t('demoSend', {app:el.dataset.v})); SH.sent = true; renderSheet(); },
  'open-basket':() => openSheet('checkout', {step:1}),
  checkout:() => openSheet('checkout', {step:2}),
  step:el => {
    const to = +el.dataset.s; const from = SH.step;
    if(to > from){ const e = validate(from); if(e){ SH.err = e; renderSheet(true); const er = document.querySelector('#sheet .err[role="alert"]'); if(er) er.scrollIntoView({block:'nearest'}); return; } }
    SH.err = ''; SH.step = to; if(to < 4) SH.code = null; SH.sugg = false; renderSheet();
  },
  'line-inc':el => { S.basket[+el.dataset.i].qty++; rerender(); },
  'line-dec':el => { const i = +el.dataset.i; S.basket[i].qty--; if(S.basket[i].qty <= 0) S.basket.splice(i, 1); save(); render(); if(SH){ if(!S.basket.length) closeSheet(); else renderSheet(true); } },
  'line-meal':el => { const l = S.basket[+el.dataset.i]; l.opts = {formule:'menu', drink:'s:Coca-Cola'}; rerender(); },
  promo:el => { const inp = document.getElementById(el.dataset.s); const v = (inp ? inp.value : '').trim().toUpperCase(); if(v === 'BIENVENUE' && !S.welcomeUsed){ S.promo = v; S.promoMsg = ''; } else S.promoMsg = v === 'BIENVENUE' ? 'used' : 'bad'; rerender(); },
  'promo-remove':() => { S.promo = ''; rerender(); },
  'pick-place':el => { const f = S.form; f.addr = completeWith(f.addr, el.dataset.v); f.commune = el.dataset.c; SH.sugg = false; SH.err = ''; save(); const n = $('#f-addr'); if(n) n.value = f.addr; updateWhere(); const d = $('#f-details'); if(d) d.focus({preventScroll:true}); },
  commune:el => { S.form.commune = el.dataset.c; SH.askCommune = false; SH.err = ''; save(); updateWhere(); const d = $('#f-details'); if(d) d.focus({preventScroll:true}); },
  'commune-change':() => { S.form.commune = ''; SH.askCommune = true; save(); updateWhere(); const b = document.querySelector('#w-zone .cchip'); if(b) b.focus({preventScroll:true}); },
  send:el => {
    const app = el.dataset.v; toast(t('demoSend', {app}));
    const f = S.form; const tt = totals();
    const sent = {app, code:SH.code, when:(f.slot === 'asap' ? hm(SH.when) : f.slot), msg:orderMessage(SH.code, SH.when), name:f.name, pay:f.pay, mode:S.mode};
    S.last = {lines:JSON.parse(JSON.stringify(S.basket)), total:tt.total, count:tt.count};
    if(S.promo === 'BIENVENUE') S.welcomeUsed = true;
    S.basket = []; S.promo = ''; S.promoMsg = ''; f.age = false; save();
    SH.step = 5; SH.sent = sent; SH.replied = false; renderSheet(); render();
    clearTimeout(replyTimer); replyTimer = setTimeout(() => { if(SH && SH.step === 5){ SH.replied = true; renderSheet(true); } }, reduceMotion() ? 50 : 1800);
  },
  reorder:() => { if(!S.last) return; S.basket = JSON.parse(JSON.stringify(S.last.lines)); save(); render(); openSheet('checkout', {step:1}); },
  close:() => closeSheet(),
  carte:() => { location.hash = 'carte'; },
  home:() => { history.length > 1 && location.hash === '#carte' ? (location.hash = '') : (location.hash = ''); },
  legal:() => toast(t('legalSoon')),
  'allergen-table':() => openSheet('allergens')
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target; const ch = el.dataset && el.dataset.ch; if(!ch) return;
  const f = S.form;
  if(ch === 'cutlery'){ S.cutlery = el.checked; rerender(); return; }
  if(ch === 'opt'){ SH.opts[el.dataset.k] = el.value; if(el.dataset.k === 'formule'){ if(el.value === 'menu' && !SH.opts.drink) SH.opts.drink = 's:Coca-Cola'; if(el.value === 'seule') delete SH.opts.drink; } renderSheet(true); return; }
  if(ch === 'kit-size'){ SH.kit.size = el.value; const n = KIT_SIZES.find(s => s.id === el.value).n; SH.kit.fillings = SH.kit.fillings.slice(0, n); renderSheet(true); return; }
  if(ch === 'kit-fill'){ const k = SH.kit; const n = KIT_SIZES.find(s => s.id === k.size).n; if(el.checked){ if(k.fillings.length < n) k.fillings.push(el.value); } else k.fillings = k.fillings.filter(x => x !== el.value); renderSheet(true); return; }
  if(ch === 'kit-side'){ SH.kit.side = el.value; renderSheet(true); return; }
  if(ch === 'slot'){ f.slot = el.value; save(); return; }
  if(ch === 'pay'){ f.pay = el.value; save(); return; }
  if(ch === 'age'){ f.age = el.checked; save(); return; }
  if(ch === 'fz-time'){ SH.f.time = el.value; return; }
  if(ch === 'fz-date'){ SH.f.date = el.value; renderSheet(true); return; }
  if(ch === 'fz-wish'){ const w = SH.f.wishes; if(el.checked) w.push(el.value); else SH.f.wishes = w.filter(x => x !== el.value); return; }
});
let addrTimer = null;
document.addEventListener('input', e => {
  const el = e.target; const k = el.dataset && el.dataset.in; if(!k) return;
  const f = S.form;
  if(k === 'addr'){
    f.addr = el.value; const det = detect(f.addr);
    if(det.commune) f.commune = det.commune; else if(det.mainland || norm(f.addr).length < 2) f.commune = '';
    if(SH){ SH.sugg = true; } save();
    clearTimeout(addrTimer); addrTimer = setTimeout(updateWhere, 120);
    return;
  }
  if(k === 'details'){ f.details = el.value; save(); return; }
  if(k === 'name'){ f.name = el.value; save(); return; }
  if(k === 'allergy'){ f.allergy = el.value; save(); return; }
  if((k === 'item-note' || k === 'kit-note') && SH){ SH.note = el.value; return; }

  if(k === 'fz-note' && SH){ SH.f.note = el.value; return; }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && SH){ closeSheet(); return; }
  if(e.key === 'Tab' && SH){
    const w = document.querySelector('#sheet .sheet'); if(!w) return;
    const f = [...w.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,a[href]')].filter(n => n.getClientRects().length && !((n.type === 'radio') && !n.checked));
    if(!f.length) return; const first = f[0], last = f[f.length - 1];
    if(!w.contains(document.activeElement)){ e.preventDefault(); first.focus(); return; }
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); return; }
    if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); return; }
  }
  if(e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.in === 'promo'){ e.preventDefault(); const b = e.target.parentNode.querySelector('[data-act="promo"]'); if(b) ACT.promo(b); }
});
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(fitWordmark, 80); });
window.addEventListener('hashchange', () => { if(SH) closeSheet(); render(); window.scrollTo(0, 0); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitWordmark).catch(() => {});

/* ================= boot ================= */
S = load() || fresh();
render();
})();
</script>

</body></html>
